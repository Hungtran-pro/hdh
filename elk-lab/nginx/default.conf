server {
    listen 8443 ssl;
    server_name nginx localhost;
    ssl_certificate /etc/nginx/tls/nginx.crt;
    ssl_certificate_key /etc/nginx/tls/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/lab/access.log combined;
    error_log /var/log/lab/error.log warn;
    auth_basic "ELK live lab";
    auth_basic_user_file /etc/nginx/auth/htpasswd;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ =404; }
    location /private/ { deny all; }
}
