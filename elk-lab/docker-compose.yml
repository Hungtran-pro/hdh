services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:?Copy .env.example to .env}
    user: '0'
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - public_certs:/usr/share/elasticsearch/public-certs
      - es_certs:/usr/share/elasticsearch/service-certs/es01
      - logstash_certs:/usr/share/elasticsearch/service-certs/logstash
      - kibana_certs:/usr/share/elasticsearch/service-certs/kibana
      - filebeat_certs:/usr/share/elasticsearch/service-certs/filebeat
      - web_certs:/usr/share/elasticsearch/service-certs/nginx
      - web_auth:/usr/share/elasticsearch/web-auth
      - ./scripts/setup.sh:/usr/local/bin/elk-setup.sh:ro
    environment:
      WEB_PASSWORD: ${WEB_PASSWORD:?Configure web credentials}
      LOGSTASH_KEYSTORE_PASSWORD: ${LOGSTASH_KEYSTORE_PASSWORD:?Set keystore password}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set password}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Set password}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?Set password}
    command: ["bash", "/usr/local/bin/elk-setup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f config/certs/es01/es01.crt"]
      interval: 5s
      retries: 24

  es01:
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    environment:
      node.name: es01
      cluster.name: elk-class-project
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      bootstrap.memory_lock: 'true'
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'true'
      xpack.security.http.ssl.key: certs/es01/es01.key
      xpack.security.http.ssl.certificate: certs/es01/es01.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: 'true'
      xpack.security.transport.ssl.key: certs/es01/es01.key
      xpack.security.transport.ssl.certificate: certs/es01/es01.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
      ES_JAVA_OPTS: '-Xms1g -Xmx1g'
    ulimits:
      memlock: {soft: -1, hard: -1}
    mem_limit: ${ES_MEM_LIMIT}
    volumes:
      - es_certs:/usr/share/elasticsearch/config/certs:ro
      - esdata:/usr/share/elasticsearch/data
      - ./kibana:/usr/local/share/lab-kibana:ro
    ports:
      - '${ES_PORT}:9200'
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 40

  init-users:
    depends_on:
      es01:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    user: '0'
    volumes:
      - public_certs:/usr/share/elasticsearch/config/certs:ro
      - ./elasticsearch/lab-template.json:/usr/local/share/lab-template.json:ro
      - ./scripts/init-users.sh:/usr/local/bin/init-users.sh:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD}
      LAB_ANALYST_PASSWORD: ${LAB_ANALYST_PASSWORD:?Set analyst password}
      LAB_VIEWER_PASSWORD: ${LAB_VIEWER_PASSWORD:?Set viewer password}
    command: ["bash", "/usr/local/bin/init-users.sh"]
    restart: 'no'

  kibana:
    restart: unless-stopped
    depends_on:
      init-users:
        condition: service_completed_successfully
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    environment:
      SERVERNAME: kibana
      SERVER_SSL_ENABLED: 'true'
      SERVER_SSL_CERTIFICATE: /usr/share/kibana/config/server-certs/kibana.crt
      SERVER_SSL_KEY: /usr/share/kibana/config/server-certs/kibana.key
      ELASTICSEARCH_HOSTS: https://es01:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: config/certs/ca/ca.crt
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set a stable key of at least 32 characters}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
    volumes:
      - public_certs:/usr/share/kibana/config/certs:ro
      - kibana_certs:/usr/share/kibana/config/server-certs:ro
      - kibanadata:/usr/share/kibana/data
    ports:
      - '${KIBANA_PORT}:5601'
    mem_limit: ${KB_MEM_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert config/certs/ca/ca.crt https://localhost:5601/api/status >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 40

  logstash:
    restart: unless-stopped
    depends_on:
      init-users:
        condition: service_completed_successfully
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    environment:
      LS_JAVA_OPTS: '-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m'
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD}
      LOGSTASH_API_PASSWORD: ${LOGSTASH_API_PASSWORD:?Set monitoring password}
      LOGSTASH_KEYSTORE_PASSWORD: ${LOGSTASH_KEYSTORE_PASSWORD}
    volumes:
      - public_certs:/usr/share/logstash/config/certs:ro
      - logstash_certs:/usr/share/logstash/config/server-certs:ro
      - logstashdata:/usr/share/logstash/data
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    mem_limit: ${LS_MEM_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert config/certs/ca/ca.crt -u monitor:$$LOGSTASH_API_PASSWORD https://localhost:9600/_node/stats/pipelines/main | grep -q '\"main\"'"]
      interval: 15s
      retries: 20

  filebeat:
    depends_on:
      logstash:
        condition: service_healthy
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION}
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./data:/logs:ro
      - ./runtime/nginx:/var/log/live-nginx:ro
      - public_certs:/usr/share/filebeat/ca:ro
      - filebeat_certs:/usr/share/filebeat/client-certs:ro
      - filebeatdata:/usr/share/filebeat/data
    restart: unless-stopped

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - public_certs:/usr/share/elasticsearch/config/certs:ro
      - ./kibana:/usr/local/share/lab-kibana:ro
      - ./scripts/init-kibana.sh:/usr/local/bin/init-kibana.sh:ro
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    command: ["bash", "/usr/local/bin/init-kibana.sh"]
    restart: 'no'

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./runtime/nginx:/var/log/lab
      - web_certs:/etc/nginx/tls:ro
      - web_auth:/etc/nginx/auth:ro
    ports:
      - '${WEB_PORT:-127.0.0.1:8443}:8443'
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 134217728

  traffic:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    profiles: [live]
    init: true
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      WEB_PASSWORD: ${WEB_PASSWORD}
      TRAFFIC_INTERVAL: ${TRAFFIC_INTERVAL:-2}
    volumes:
      - ./scripts/traffic.py:/app/traffic.py:ro
      - public_certs:/ca:ro
    command: ["python", "-u", "/app/traffic.py"]
    mem_limit: 67108864

volumes:
  certs:
  public_certs:
  logstashdata:
  esdata:
  kibanadata:
  filebeatdata:
  es_certs:
  logstash_certs:
  kibana_certs:
  filebeat_certs:
  web_certs:
  web_auth:
