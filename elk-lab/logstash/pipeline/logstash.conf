input {
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/server-certs/logstash.crt"
    ssl_key => "/usr/share/logstash/config/server-certs/logstash.pkcs8.key"
    ssl_certificate_authorities => ["/usr/share/logstash/config/server-certs/beats-ca.crt"]
    ssl_client_authentication => "required"
    enrich => ["codec_metadata", "source_metadata", "ssl_peer_metadata"]
  }
}
filter {
  if [@metadata][input][beats][tls][client][subject] != "CN=filebeat" {
    drop { }
  }
  mutate {
    copy => {
      "message" => "[event][original]"
      "[@metadata][input][beats][tls][client][subject]" => "[tls][client][subject]"
      "[@metadata][input][beats][tls][version_protocol]" => "[tls][version]"
    }
  }
  if [log_type] == "nginx" {
    grok {
      match => { "message" => '^%{IPORHOST:[client][ip]} %{HTTPDUSER:ident} %{HTTPDUSER:auth} \[%{HTTPDATE:nginx_timestamp}\] "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status_code]:int} (?:%{INT:[http][response][body][bytes]:int}|-)(?: "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}")?.*$' }
      tag_on_failure => ["_nginx_parse_failure"]
    }
    if ! ("_nginx_parse_failure" in [tags]) {
      date { match => ["nginx_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"] target => "@timestamp" locale => "en" }
    }
    mutate { remove_field => ["nginx_timestamp", "ident", "auth"] }
  } else if [log_type] == "apache_error" {
    grok {
      match => { "message" => [
        '^\[%{DAY:apache_dow} %{MONTH:apache_mon} %{MONTHDAY:apache_day} %{TIME:apache_time} %{YEAR:apache_year}\] \[%{LOGLEVEL:[log][level]}\] %{GREEDYDATA:apache_detail}$',
        '^\[%{HTTPDATE:apache_timestamp}\] \[%{LOGLEVEL:[log][level]}\] %{GREEDYDATA:apache_detail}$',
        '^\[%{TIMESTAMP_ISO8601:apache_timestamp}\] \[%{DATA:apache_module}:%{LOGLEVEL:[log][level]}\] %{GREEDYDATA:apache_detail}$'
      ] }
      tag_on_failure => ["_apache_parse_failure"]
    }
    if ! ("_apache_parse_failure" in [tags]) {
      if [apache_year] {
        mutate { add_field => { "apache_joined_date" => "%{apache_mon} %{apache_day} %{apache_time} %{apache_year}" } }
        date { match => ["apache_joined_date", "MMM dd HH:mm:ss yyyy"] target => "@timestamp" locale => "en" timezone => "UTC" }
      } else if [apache_timestamp] {
        date { match => ["apache_timestamp", "dd/MMM/yyyy:HH:mm:ss Z", "ISO8601"] target => "@timestamp" locale => "en" }
      }
    }
    mutate { remove_field => ["apache_timestamp", "apache_joined_date", "apache_dow", "apache_mon", "apache_day", "apache_time", "apache_year"] }
  } else if [log_type] == "spring" {
    grok {
      match => { "message" => '(?m)^%{TIMESTAMP_ISO8601:spring_timestamp}\s+%{LOGLEVEL:[log][level]}\s+%{GREEDYDATA:spring_detail}$' }
      tag_on_failure => ["_spring_parse_failure"]
    }
    if ! ("_spring_parse_failure" in [tags]) {
      date { match => ["spring_timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" timezone => "Asia/Ho_Chi_Minh" }
    }
    mutate { remove_field => ["spring_timestamp"] }
  } else {
    mutate { add_tag => ["_unknown_source"] }
  }
}
output {
  elasticsearch {
    hosts => ["https://es01:9200"]
    data_stream => false
    index => "lab-logs-%{+yyyy.MM.dd}"
    user => "logstash_ingest"
    password => "${LOGSTASH_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    manage_template => false
    ilm_enabled => false
  }
}
