node.name: logstash
path.config: /usr/share/logstash/pipeline
pipeline.ecs_compatibility: v8
pipeline.workers: 2
pipeline.buffer.type: direct
queue.type: persisted
queue.checkpoint.writes: 1
dead_letter_queue.enable: true
xpack.monitoring.enabled: false
api.http.host: 127.0.0.1
api.ssl.enabled: true
api.ssl.keystore.path: /usr/share/logstash/config/server-certs/logstash-api.p12
api.ssl.keystore.password: ${LOGSTASH_KEYSTORE_PASSWORD}
api.auth.type: basic
api.auth.basic.username: monitor
api.auth.basic.password: ${LOGSTASH_API_PASSWORD}
